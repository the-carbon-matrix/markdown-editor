services:
  backend:
    build:
      dockerfile: backend/Dockerfile
    container_name: markdown-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - md-notes:/app/backend/app/data
      - md-db:/app/backend/instance
      

  frontend:
    build:
      dockerfile: frontend/Dockerfile
    container_name: markdown-frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  md-notes:
  md-db:
